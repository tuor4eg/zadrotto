# Add this directive to the existing nginx `http` context.
proxy_cache_path /var/cache/nginx/zadrotto-covers
    levels=1:2
    keys_zone=zadrotto_covers:10m
    max_size=5g
    inactive=30d
    use_temp_path=off;

# Add this location to the existing zadrotto.guskov.dev `server` context.
location ^~ /_protected-covers/ {
    internal;

    proxy_pass https://s3.ru1.storage.beget.cloud/f2b3393cb6fc-zadrotto/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name s3.ru1.storage.beget.cloud;
    proxy_set_header Host s3.ru1.storage.beget.cloud;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";

    proxy_cache zadrotto_covers;
    proxy_cache_key $uri;
    proxy_cache_lock on;
    proxy_cache_valid 200 30d;
    proxy_cache_valid any 0;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "private, max-age=31536000, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

